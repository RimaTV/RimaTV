<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">

  <meta charset="UTF-8">

  <!-- Browser compatibility -->
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- Primary SEO -->
  <meta
    name="description"
    content="Rima TV - Live TV channels from around the world, always with you."
  >
  <meta
    name="keywords"
    content="Rima TV, live TV, IPTV, television channels, live channels, online TV"
  >
  <meta name="author" content="Rima TV">

  <!-- Responsive layout -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <!-- Browser / PWA theme -->
  <meta name="theme-color" content="#000000">

  <!-- PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="Rima TV">

  <!-- iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >
  <meta name="apple-mobile-web-app-title" content="Rima TV">

  <!-- iOS icon -->
  <link
    rel="apple-touch-icon"
    href="icons/icon-192.png"
  >

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/png"
    href="favicon.png"
  >

  <!-- PWA Manifest -->
  <link
    rel="manifest"
    href="manifest.json"
  >

  <!-- Open Graph / Social sharing -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Rima TV">
  <meta
    property="og:description"
    content="Live TV channels from around the world, always with you."
  >
  <meta
    property="og:image"
    content="icons/icon-512.png"
  >

  <title>Rima TV</title>

  <!-- HLS.js -->
  <script
    src="https://cdn.jsdelivr.net/npm/hls.js@1"
    type="application/javascript"
  ></script>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000000;
      overflow: hidden;
    }

    #flutter_host {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <!-- Flutter -->
  <script
    src="flutter_bootstrap.js"
    async
  ></script>
</body>
</html>
